name: CI/CD

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

jobs:
  validate:
    name: Validate client and server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run frontend quality checks
        run: npm run ci --workspace=client

      - name: Run backend integrity and smoke checks
        run: npm run ci --workspace=server

  docker-build:
    name: Validate Docker image build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t kichain-dev:test .

  deploy-dev:
    name: Build, push, and deploy dev image
    runs-on: ubuntu-latest
    environment: AWS Dev
    needs:
      - validate
      - docker-build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Derive image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          ECR_REPO="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "ecr_repo=$ECR_REPO" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ secrets.AWS_REGION }}" | \
          docker login --username AWS --password-stdin "${{ steps.meta.outputs.ecr_repo }}"

      - name: Build Docker image
        run: |
          docker build \
          --build-arg VITE_BUILD_VERSION="${{ steps.meta.outputs.short_sha }}" \
          -t kichain-dev:local .

      - name: Tag Docker image
        run: |
          docker tag kichain-dev:local "${{ steps.meta.outputs.ecr_repo }}:${{ steps.meta.outputs.short_sha }}"
          docker tag kichain-dev:local "${{ steps.meta.outputs.ecr_repo }}:dev"

      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.meta.outputs.ecr_repo }}:${{ steps.meta.outputs.short_sha }}"
          docker push "${{ steps.meta.outputs.ecr_repo }}:dev"

      - name: Keep latest 5 rollback image tags in ECR
        run: |
          set -e

          REPO="${{ secrets.ECR_REPOSITORY }}"

          OLD_TAGS=$(aws ecr describe-images \
            --repository-name "$REPO" \
            --query "sort_by(imageDetails[?imageTags && !contains(imageTags, 'dev')], &imagePushedAt)[0:-5].imageTags[0]" \
            --output text)

          if [ -z "$OLD_TAGS" ] || [ "$OLD_TAGS" = "None" ]; then
            echo "No old ECR image tags to delete."
            exit 0
          fi

          for TAG in $OLD_TAGS; do
            echo "Deleting old ECR image tag: $TAG"
            aws ecr batch-delete-image \
              --repository-name "$REPO" \
              --image-ids imageTag="$TAG" || true
          done

      - name: Deploy on EC2 via SSM
        run: |
          set -e

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=kichain-dev" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No running EC2 instance found with tag Name=kichain-dev"
            exit 1
          fi

          cat > deploy.sh <<'EOF'
          set -e

          ACCOUNT_ID="__AWS_ACCOUNT_ID__"
          REGION="__AWS_REGION__"
          ECR_REPOSITORY="__ECR_REPOSITORY__"
          ECR_REPO="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$ECR_REPOSITORY"

          aws ecr get-login-password --region "$REGION" | \
            docker login --username AWS --password-stdin "$ECR_REPO"

          docker pull "$ECR_REPO:dev"

          docker network inspect kichain-net >/dev/null 2>&1 || docker network create kichain-net

          if ! docker ps -a --format '{{.Names}}' | grep -q '^kichain-db$'; then
            docker run -d \
              --name kichain-db \
              --restart unless-stopped \
              --network kichain-net \
              -p 27017:27017 \
              mongo:latest
          elif ! docker ps --format '{{.Names}}' | grep -q '^kichain-db$'; then
            docker start kichain-db
          fi

          if docker ps -a --format '{{.Names}}' | grep -q '^kichain-dev$'; then
            docker stop kichain-dev || true
            docker rm kichain-dev || true
          fi

          docker run -d \
            --name kichain-dev \
            --restart unless-stopped \
            --network kichain-net \
            --env-file /home/ubuntu/kichain-dev.env \
            -p 5173:5173 \
            -p 3000:3000 \
            "$ECR_REPO:dev"

          echo "Waiting for backend health check..."

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              echo "Backend is healthy."
              exit 0
            fi

            echo "Backend not ready yet. Attempt $i/30"
            docker ps -a
            docker logs --tail 40 kichain-dev || true
            sleep 2
          done

          echo "Backend failed to become healthy."
          docker ps -a
          docker logs --tail 150 kichain-dev || true
          exit 1
          EOF

          sed -i "s|__AWS_ACCOUNT_ID__|${{ secrets.AWS_ACCOUNT_ID }}|g" deploy.sh
          sed -i "s|__AWS_REGION__|${{ secrets.AWS_REGION }}|g" deploy.sh
          sed -i "s|__ECR_REPOSITORY__|${{ secrets.ECR_REPOSITORY }}|g" deploy.sh

          DEPLOY_SCRIPT_B64=$(base64 -w 0 deploy.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="echo $DEPLOY_SCRIPT_B64 | base64 -d > /tmp/kichain-deploy.sh && bash /tmp/kichain-deploy.sh" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json)

          echo "$RESULT"

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          if [ "$STATUS" != "Success" ]; then
            echo "SSM deployment failed with status: $STATUS"
            exit 1
          fi